spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:mem:hostflow_marketing_test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  rabbitmq:
    host: localhost
    port: 5672

hostflow:
  ai:
    fastapi:
      base-url: http://localhost:9000
      timeout-seconds: 5
