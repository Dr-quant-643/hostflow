spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:mem:hostflow_notification_test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  rabbitmq:
    host: localhost
    port: 5672
  mail:
    host: localhost
    port: 2525
    username: test
    password: test

hostflow:
  rabbitmq:
    exchanges:
      direct: hostflow.direct
      dlx: hostflow.dlx
    queues:
      notification:
        email: hostflow.notification.email
        sms: hostflow.notification.sms
        push: hostflow.notification.push
        whatsapp: hostflow.notification.whatsapp
    routing-keys:
      notification:
        email: notification.email
        sms: notification.sms
        push: notification.push
        whatsapp: notification.whatsapp
    dlq: hostflow.dlq
